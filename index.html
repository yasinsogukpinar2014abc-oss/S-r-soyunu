<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonsuz Sürüş Simülatörü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        
        #gameContainer { position: relative; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* KONTROL PANELİ VE BUTONLAR - Tıklama sorunu tamamen çözüldü */
        .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; color: white; text-align: center; pointer-events: auto; }
        h1 { font-size: 26px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(0,255,204,0.4); color: #00ffcc; font-weight: bold; letter-spacing: 1px; }
        
        .btn { background: #00ffcc; color: #000; border: none; padding: 16px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 25px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,255,204,0.4); display: block; pointer-events: auto; z-index: 10000; }
        .btn:active { transform: scale(0.95); background: #00ccaa; }
        
        .btn-secondary { background: #222d3d; color: #fff; border: 2px solid #334155; padding: 12px 5px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1; min-width: 0; pointer-events: auto; z-index: 10000; -webkit-tap-highlight-color: transparent; }
        .btn-active { background: #ff0055 !important; color: white !important; border-color: #ff0055 !important; box-shadow: 0 0 10px rgba(255,0,85,0.4); }

        /* Seçim Alanları */
        .select-group { margin: 8px 0; width: 100%; max-width: 340px; pointer-events: auto; display: block; }
        .select-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; text-align: left; display: block; padding-left: 2px; font-weight: bold; letter-spacing: 0.5px; }
        .options-row { display: flex; gap: 8px; width: 100%; pointer-events: auto; }

        /* Oyun İçi Göstergeler */
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; color: white; font-weight: bold; font-size: 16px; font-family: monospace; z-index: 5; text-shadow: 1px 1px 3px black; }
        #hud-settings-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 5px; font-size: 14px; pointer-events: auto; z-index: 50; cursor: pointer; }

        /* Mobil Kontroller */
        #controls { position: absolute; bottom: 20px; left: 0; width: 100%; padding: 0 20px; display: none; justify-content: space-between; align-items: flex-end; z-index: 15; }
        .control-block { display: flex; gap: 15px; }
        .pedal { width: 70px; height: 110px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); -webkit-user-select: none; pointer-events: auto; }
        #gas { background: rgba(0, 255, 100, 0.15); border-color: #00ff64; }
        #gas:active { background: rgba(0, 255, 100, 0.4); }
        #brake { background: rgba(255, 0, 50, 0.15); border-color: #ff0032; }
        #brake:active { background: rgba(255, 0, 50, 0.4); }
        
        #steering-container { width: 130px; height: 130px; display: flex; justify-content: center; align-items: center; position: relative; }
        .arrow-btn { width: 58px; height: 58px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; pointer-events: auto; }
        .arrow-btn:active { background: rgba(255,255,255,0.4); }
        #wheel { width: 115px; height: 115px; border: 8px double white; border-radius: 50%; position: relative; transition: transform 0.05s linear; display: none; background: rgba(0,0,0,0.5); pointer-events: auto; }
        #wheel::before { content: ''; position: absolute; top: 0; left: 45px; width: 8px; height: 30px; background: #ff0055; }
        #wheel::after { content: ''; position: absolute; top: 50px; left: 0; width: 99px; height: 8px; background: white; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <div id="stats">HIZ: <span id="speed-val">0</span> km/h<br>SKOR: <span id="score-val">0</span></div>
    </div>
    <button id="hud-settings-btn" style="display:none;" onclick="openSettings()">AYARLAR</button>

    <canvas id="gameCanvas"></canvas>

    <!-- Giriş ve Ayarlar Menüsü -->
    <div id="menuPanel" class="panel">
        <h1>3D SÜRÜŞ MOTORU</h1>
        
        <!-- Araba Seçimi -->
        <div class="select-group">
            <span class="select-label">ARAÇ DEĞİŞTİR</span>
            <div class="options-row">
                <button class="btn-secondary btn-active" id="car-tesla" onclick="setCar('tesla')">Tesla</button>
                <button class="btn-secondary" id="car-cyber" onclick="setCar('cyber')">Cybertruck</button>
                <button class="btn-secondary" id="car-truck" onclick="setCar('truck')">Tır</button>
            </div>
        </div>

        <!-- Yol/Gezegen Seçimi -->
        <div class="select-group">
            <span class="select-label">GEZEGEN / HARİTA</span>
            <div class="options-row">
                <button class="btn-secondary btn-active" id="world-earth" onclick="setWorld('earth')">Dünya</button>
                <button class="btn-secondary" id="world-desert" onclick="setWorld('desert')">Mars</button>
                <button class="btn-secondary" id="world-neon" onclick="setWorld('neon')">Siber Şehir</button>
            </div>
        </div>

        <!-- Hava Durumu -->
        <div class="select-group">
            <span class="select-label">HAVA DURUMU</span>
            <div class="options-row">
                <button class="btn-secondary btn-active" id="weather-day" onclick="setWeather('day')">Açık</button>
                <button class="btn-secondary" id="weather-fog" onclick="setWeather('fog')">Sisli/Tozlu</button>
            </div>
        </div>

        <!-- Kontrol Türü -->
        <div class="select-group">
            <span class="select-label">DİREKSİYON AYARI</span>
            <div class="options-row">
                <button class="btn-secondary btn-active" id="ctrl-arrows" onclick="setControl('arrows')">Ok Tuşları</button>
                <button class="btn-secondary" id="ctrl-wheel" onclick="setControl('wheel')">Direksiyon</button>
            </div>
        </div>

        <button class="btn" onclick="startGame()">SÜRÜŞÜ BAŞLAT</button>
    </div>

    <!-- Oyun İçi Dokunmatik Kontroller -->
    <div id="controls">
        <div id="steering-container">
            <div id="arrow-controls" class="control-block">
                <div class="arrow-btn" id="btn-left">◀</div>
                <div class="arrow-btn" id="btn-right">▶</div>
            </div>
            <div id="wheel"></div>
        </div>

        <div class="control-block">
            <div class="pedal" id="brake">FREN</div>
            <div class="pedal" id="gas">GAZ</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameState = 'menu';
    let speed = 0;
    let maxSpeed = 180;
    let score = 0;
    let playerX = 0; 
    let playerY = 0; 
    let jumpVelocity = 0;
    let isJumping = false;
    let trackPosition = 0;

    let currentCar = 'tesla';
    let currentWorld = 'earth';
    let currentWeather = 'day';
    let controlType = 'arrows';

    let keys = { left: false, right: false, gas: false, brake: false };

    const themes = {
        earth: { sky: '#72b7fc', grass: '#149341', road: '#444', line: '#fff', hill: '#0d662c' },
        desert: { sky: '#e26a37', grass: '#b85028', road: '#553322', line: '#ffcc00', hill: '#803018' },
        neon: { sky: '#050014', grass: '#100028', road: '#1a0033', line: '#00ffff', hill: '#080018' }
    };

    let segments = [];
    for(let i=0; i<500; i++) {
        segments.push({
            curve: Math.sin(i / 20) * 1.5 + (i > 200 && i < 300 ? Math.cos(i/10)*3 : 0),
            hill: Math.sin(i / 10) * 20,
            obstacle: (i % 35 === 0) ? (Math.random() > 0.4 ? 'ramp' : 'rock') : null,
            obsX: Math.random() * 1.2 - 0.6
        });
    }

    function bindPedal(id, keyProp) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    }
    bindPedal('gas', 'gas');
    bindPedal('brake', 'brake');

    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

    const wheelEl = document.getElementById('wheel');
    let wheelActive = false;
    let wheelAngle = 0;

    wheelEl.addEventListener('touchstart', (e) => { e.preventDefault(); wheelActive = true; });
    wheelEl.addEventListener('touchmove', (e) => {
        if (!wheelActive) return;
        let rect = wheelEl.getBoundingClientRect();
        let center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        let touch = e.touches[0];
        let angle = Math.atan2(touch.clientY - center.y, touch.clientX - center.x) * 180 / Math.PI;
        wheelAngle = Math.max(-90, Math.min(90, angle - 90));
        wheelEl.style.transform = `rotate(${wheelAngle}deg)`;
        
        if (wheelAngle < -15) { keys.left = true; keys.right = false; }
        else if (wheelAngle > 15) { keys.right = true; keys.left = false; }
        else { keys.left = false; keys.right = false; }
    });
    wheelEl.addEventListener('touchend', (e) => {
        wheelActive = false;
        wheelAngle = 0;
        wheelEl.style.transform = `rotate(0deg)`;
        keys.left = false;
        keys.right = false;
    });

    function setCar(type) {
        ['tesla', 'cyber', 'truck'].forEach(c => document.getElementById('car-'+c).classList.remove('btn-active'));
        document.getElementById('car-'+type).classList.add('btn-active');
        currentCar = type;
        maxSpeed = type === 'truck' ? 100 : (type === 'cyber' ? 150 : 180);
    }
    function setWorld(type) {
        ['earth', 'desert', 'neon'].forEach(w => document.getElementById('world-'+w).classList.remove('btn-active'));
        document.getElementById('world-'+type).classList.add('btn-active');
        currentWorld = type;
    }
    function setWeather(type) {
        ['day', 'fog'].forEach(w => document.getElementById('weather-'+w).classList.remove('btn-active'));
        document.getElementById('weather-'+type).classList.add('btn-active');
        currentWeather = type;
    }
    function setControl(type) {
        ['arrows', 'wheel'].forEach(c => document.getElementById('ctrl-'+c).classList.remove('btn-active'));
        document.getElementById('ctrl-'+type).classList.add('btn-active');
        controlType = type;
        if(type === 'wheel') {
            document.getElementById('arrow-controls').style.display = 'none';
            document.getElementById('wheel').style.display = 'block';
        } else {
            document.getElementById('arrow-controls').style.display = 'flex';
            document.getElementById('wheel').style.display = 'none';
        }
    }

    function startGame() {
        document.getElementById('menuPanel').style.display = 'none';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('hud-settings-btn').style.display = 'block';
        gameState = 'play';
    }

    function openSettings() {
        gameState = 'menu';
        document.getElementById('menuPanel').style.display = 'flex';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('hud-settings-btn').style.display = 'none';
        keys = { left: false, right: false, gas: false, brake: false };
    }

    window.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if(e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
        if(e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
    });
    window.addEventListener('keyup', (e) => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if(e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
        if(e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
    });

    function draw() {
        let theme = themes[currentWorld];
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = theme.sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

        ctx.fillStyle = theme.hill;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2);
        for(let i=0; i<=canvas.width; i+=50) {
            ctx.lineTo(i, (canvas.height/2) - 30 + Math.sin(i/40 + trackPosition/100)*15);
        }
        ctx.lineTo(canvas.width, canvas.height/2);
        ctx.fill();

        let horizon = canvas.height / 2;
        let startSeg = Math.floor(trackPosition / 20) % segments.length;
        
        let currentCurve = 0;

        ctx.fillStyle = theme.grass;
        ctx.fillRect(0, horizon, canvas.width, canvas.height / 2);

        for (let i = 0; i < 60; i++) {
            let seg = segments[(startSeg + i) % segments.length];
            let p1 = perspective(playerX, horizon, i, currentCurve);
            let p2 = perspective(playerX, horizon, i + 1, currentCurve + seg.curve);
            currentCurve += seg.curve;

            ctx.fillStyle = (startSeg + i) % 2 === 0 ? theme.road : '#3a3a3a';
            ctx.beginPath();
            ctx.moveTo(p1.xl, p1.y);
            ctx.lineTo(p2.xl, p2.y);
            ctx.lineTo(p2.xr, p2.y);
            ctx.lineTo(p1.xr, p1.y);
            ctx.fill();

            if ((startSeg + i) % 3 === 0) {
                ctx.fillStyle = theme.line;
                ctx.beginPath();
                ctx.moveTo(p1.xc - p1.w*0.03, p1.y);
                ctx.lineTo(p2.xc - p2.w*0.03, p2.y);
                ctx.lineTo(p2.xc + p2.w*0.03, p2.y);
                ctx.lineTo(p1.xc + p1.w*0.03, p1.y);
                ctx.fill();
            }

            if (seg.obstacle) {
                let obsW = p1.w * 0.25;
                let obsXPos = p1.xc + (seg.obsX * p1.w);
                
                if (seg.obstacle === 'ramp') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.moveTo(obsXPos - obsW, p1.y);
                    ctx.lineTo(obsXPos + obsW, p1.y);
                    ctx.lineTo(obsXPos + obsW * 0.7, p1.y - obsW * 0.5);
                    ctx.lineTo(obsXPos - obsW * 0.7, p1.y - obsW * 0.5);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (i === 4 && Math.abs(playerX - seg.obsX) < 0.3 && !isJumping && speed > 20) {
                        isJumping = true;
                        jumpVelocity = speed * 0.16;
                    }
                } else {
                    ctx.fillStyle = '#777';
                    ctx.beginPath();
                    ctx.arc(obsXPos, p1.y - obsW*0.3, obsW*0.4, 0, Math.PI, true);
                    ctx.fill();

                    if (i === 4 && Math.abs(playerX - seg.obsX) < 0.25 && playerY < 10) {
                        speed = Math.floor(speed * 0.3);
                        score = Math.max(0, score - 5);
                    }
                }
            }
        }

        drawPlayerCar();

        if (currentWeather === 'fog') {
            ctx.fillStyle = currentWorld === 'desert' ? 'rgba(230,130,70,0.4)' : 'rgba(230,240,255,0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function perspective(pX, horizon, index, curve) {
        let scale = 1 / (index + 1);
        let y = horizon + (canvas.height - horizon) * (1 - scale);
        let w = canvas.width * 0.75 * scale;
        let xc = canvas.width / 2 + curve * (1 - scale) * 35 - (pX * canvas.width * 0.3 * scale);
        return { y: y, w: w, xc: xc, xl: xc - w, xr: xc + w };
    }

    function drawPlayerCar() {
        let cx = canvas.width / 2;
        let cy = canvas.height - 70 - playerY;
        
        ctx.save();
        if (isJumping) {
            ctx.translate(cx + Math.sin(trackPosition)*2, cy);
            ctx.scale(1.1, 1.1);
        } else {
            ctx.translate(cx, cy);
        }

        if (currentCar === 'tesla') {
            ctx.fillStyle = '#cc1111';
            ctx.fillRect(-35, 10, 70, 25);
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(-32, -3, 64, 15);
            ctx.fillStyle = '#222';
            ctx.fillRect(-25, 0, 50, 10);
            ctx.fillStyle = '#ffffcc';
            ctx.fillRect(-32, 20, 12, 6);
            ctx.fillRect(20, 20, 12, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(-38, 22, 10, 15);
            ctx.fillRect(28, 22, 10, 15);
        } 
        else if (currentCar === 'cyber') {
            ctx.fillStyle = '#88888e';
            ctx.beginPath();
            ctx.moveTo(-40, 25);
            ctx.lineTo(-42, 5);
            ctx.lineTo(0, -12);
            ctx.lineTo(42, 8);
            ctx.lineTo(40, 25);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#66ccff';
            ctx.fillRect(-20, -2, 40, 5);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-35, 10, 70, 4);
            ctx.fillStyle = '#111';
            ctx.fillRect(-43, 16, 12, 16);
            ctx.fillRect(31, 16, 12, 16);
        } 
        else if (currentCar === 'truck') {
            ctx.fillStyle = '#1a5276';
            ctx.fillRect(-42, -25, 84, 50);
            ctx.fillStyle = '#2e86c1';
            ctx.fillRect(-36, -45, 72, 25);
            ctx.fillStyle = '#111';
            ctx.fillRect(-32, -15, 64, 15);
            ctx.fillStyle = '#bbb';
            ctx.fillRect(-20, 12, 40, 12);
            ctx.fillStyle = '#ffa500';
            ctx.fillRect(-30, -48, 6, 4);
            ctx.fillRect(0, -48, 6, 4);
            ctx.fillRect(24, -48, 6, 4);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(-47, -35, 6, 40);
            ctx.fillRect(41, -35, 6, 40);
            ctx.fillStyle = '#000';
            ctx.fillRect(-46, 10, 14, 24);
            ctx.fillRect(32, 10, 14, 24);
        }
        ctx.restore();
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Surus Oyunu</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; width: 80%; }
        button { padding: 20px; font-size: 20px; background: #222; color: white; border: 2px solid #444; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
        button.selected { background: #ff0055; border-color: #ff0055; }
        #start-btn { background: #00ffcc; color: black; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>ARACINI SEC</h1>
    <div class="btn-container">
        <button id="car1" class="selected" onclick="selectCar(1)">Tesla</button>
        <button id="car2" onclick="selectCar(2)">Cybertruck</button>
        <button id="car3" onclick="selectCar(3)">Tır</button>
        <button id="start-btn" onclick="başlat()">SÜRÜŞÜ BAŞLAT</button>
    </div>

    <script>
        function selectCar(id) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            document.getElementById('car' + id).classList.add('selected');
            alert('Arac ' + id + ' seçildi!');
        }
        function başlat() {
            alert('Oyun Başlıyor!');
        }
    </script>
</body>
</html>
